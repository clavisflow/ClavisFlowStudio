project_id = "clavisflow-studio"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://studio.clavisflow.net"
additional_redirect_urls = [
  "https://studio.clavisflow.net/auth/callback/**",
  "http://localhost:3000/auth/callback/**",
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[functions.create-flow]
verify_jwt = false
[functions.update-flow]
verify_jwt = false
[functions.publish-flow]
verify_jwt = false
[functions.get-public-flow]
verify_jwt = false
[functions.get-edit-flow]
verify_jwt = false
[functions.unpublish-flow]
verify_jwt = false
[functions.delete-flow]
verify_jwt = false
[functions.generate-sql]
verify_jwt = false
[functions.upload-flow-sample]
verify_jwt = false
[functions.get-flow-sample]
verify_jwt = false
[functions.list-public-flows]
verify_jwt = false
[functions.flow-favorites]
verify_jwt = false
[functions.flow-usage]
verify_jwt = false
